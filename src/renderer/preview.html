<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>文件预览</title>
  <link rel="stylesheet" href="./src/preview.css" />
</head>
<body>
  <header id="head">
    <span id="fileIcon" class="file-icon" aria-hidden="true"></span>
    <h1 id="title">文件预览</h1>
    <div class="meta">
      <span class="meta-item"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M7 14.5h4"/></svg><span id="metaSize">—</span></span>
      <span class="meta-item"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/></svg><span id="metaTime">—</span></span>
    </div>
    <div class="head-actions">
      <button id="modeBtn" class="icon-btn" hidden type="button" title="查看源码" aria-label="查看源码"></button>
      <button id="openExternal" type="button" title="使用系统程序打开">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 4h7v7M20 4l-9 9M19 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h4"/></svg>
        <span>系统打开</span>
      </button>
    </div>
  </header>
  <div id="content"></div>
  <script type="module" src="./src/preview.ts"></script>
</body>
</html>
