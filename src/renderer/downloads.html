<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>下载管理</title>
  <link rel="stylesheet" href="./src/downloads.css" />
</head>
<body>
  <div class="page">
    <h1>下载管理</h1>
    <p class="hint">文件统一保存到 data/downloads，不会弹出系统保存对话框</p>
    <div class="toolbar">
      <input id="filter" type="text" placeholder="筛选文件名或网址" />
      <span id="count" class="count"></span>
      <button id="openFolder">打开文件夹</button>
      <button id="clearCompleted">清空已完成</button>
    </div>
    <div id="error" class="error" hidden></div>
    <div id="list" class="card"></div>
  </div>
  <script type="module" src="./src/downloads.ts"></script>
</body>
</html>
