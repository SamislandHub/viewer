<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Viewer</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <header id="titlebar">
    <div class="toolbar">
      <div class="nav-group">
        <button id="home" class="tool-icon" title="主页">
          <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8" fill="none" stroke="#ff9500" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M5.5 10v10h13V10" fill="#fff" stroke="#adb5bd" stroke-width="1.4" stroke-linejoin="round" /></svg>
        </button>
        <button id="back" class="tool-icon" title="后退">
          <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" /></svg>
        </button>
        <button id="forward" class="tool-icon" title="前进">
          <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6" /></svg>
        </button>
        <button id="reload" class="tool-icon" title="刷新">
          <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7" /></svg>
        </button>
      </div>
      <div class="url-box">
        <input id="url" type="text" placeholder="搜索或输入网址，回车访问" />
        <button id="bookmark" class="url-star" title="收藏当前页 (Ctrl+D)">
          <svg viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.2 1 5.9L12 17l-5.2 2.8 1-5.9-4.3-4.2 5.9-.8z" /></svg>
        </button>
      </div>
      <div class="tool-actions">
        <button id="pickElement" class="tool-icon" title="元素选择：点击页面元素查看信息">
          <svg viewBox="0 0 24 24"><path d="M5 3l13.5 8-6.3 1.4L9.4 20 5 3z" /><path d="M12.2 12.4l3.2 5.6" /></svg>
        </button>
        <button id="screenshot" class="tool-icon" title="截图：保存到 data/screenshots">
          <svg viewBox="0 0 24 24"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z" /><circle cx="12" cy="13" r="3.2" /></svg>
        </button>
      </div>
      <button id="pinWindow" class="tool-icon" title="窗口置顶">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" /><path d="M12 12v9" /></svg>
      </button>
      <div class="wincontrols">
        <button id="winmin" title="最小化">─</button>
        <button id="winmax" title="最大化/还原">□</button>
        <button id="winclose" title="关闭" class="close">×</button>
      </div>
    </div>
  </header>

  <div id="workspace">
    <aside id="left-panel">
      <div class="panel-title">
        <span class="title-text">标签页</span>
        <button id="toggleSidebar" title="收起/展开侧边栏">
          <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" /></svg>
        </button>
      </div>
      <div id="tabs">
        <div id="tabList">
          <button id="newtab-side" title="新建标签页">
            <span class="plus-icon">+</span><span class="newtab-label">新建标签页</span>
          </button>
        </div>
      </div>
      <div class="side-tools">
        <button id="openSettings" class="side-settings" title="设置">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 0 1-4 0v-.09a1.7 1.7 0 0 0-1.1-1.55 1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.88 1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 0 1 0-4h.09a1.7 1.7 0 0 0 1.55-1.1 1.7 1.7 0 0 0-.34-1.88l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.88.34H9a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 0 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.88-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.88V9a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 0 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z" /></svg>
          <span>设置</span>
        </button>
        <button id="openHistory" class="side-settings" title="历史记录">
          <svg viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1M3.5 5v4h4" /><path d="M12 7.5V12l3 2" /></svg>
          <span>历史记录</span>
        </button>
        <button id="openBookmarks" class="side-settings" title="收藏夹">
          <svg viewBox="0 0 24 24"><path d="M6 4h12v16l-6-4-6 4z" /></svg>
          <span>收藏夹</span>
        </button>
        <button id="openDownloads" class="side-settings" title="下载管理">
          <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 18v2h16v-2" /></svg>
          <span>下载管理</span>
        </button>
      </div>
    </aside>

    <div id="page-slot"></div>
    <div id="empty-page">没有打开的标签页<br /><span>点击左上角 + 或按 Ctrl+T 新建</span></div>
  </div>

  <!-- floating UI owned by the shell renderer -->
  <div id="pickHint" class="pick-hint" hidden>元素选择已开启：点击页面上的元素查看信息，按 Esc 退出</div>

  <div id="elementCard" class="element-card" hidden>
    <div class="popover-head"><span>元素信息</span><button class="popover-close" title="关闭">×</button></div>
    <div id="elementBody" class="element-body"></div>
  </div>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
