<!doctype html>
<html><head><meta charset="utf-8"><title>键盘测试</title>
<style>body{font:16px sans-serif;padding:20px}input{font:16px;padding:8px;width:320px}</style>
</head><body>
<h2>虚拟键盘测试</h2>
<input id="field" type="text" value="" placeholder="点这里输入" />
<pre id="log"></pre>
<script>
  const f=document.getElementById('field');
  for(const e of ['input','keydown','paste']) f.addEventListener(e,()=>{
    document.getElementById('log').textContent += e+'\n';
  });
</script>
</body></html>
